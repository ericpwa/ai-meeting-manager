name: Antigravity Continuous Self-Check & Security Audit CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # 每日 UTC 00:00 (台灣時間 08:00) 自動執行迴歸測試與資安稽核
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  test-and-security-audit:
    name: Run Pytest (RACI/SMART/QCD+T + E2E UI + Zero Hardcoded Key Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Unit, Governance, Security & Streamlit E2E Tests
        run: |
          pytest -v
